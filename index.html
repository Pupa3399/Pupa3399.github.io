<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GuanTing Wu - Master's student at Zhejiang University, focusing on AI agents and large language model reasoning."
    />
    <title>GuanTing Wu</title>

    <style>
      :root {
        color-scheme: light;
        --background: #f6f6f2;
        --surface: #ffffff;
        --text: #181a1b;
        --muted: #666b6d;
        --line: #d9dbd5;
        --accent: #d9e66d;
        --accent-dark: #1e5e58;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
        border-bottom: 1px solid var(--line);
      }

      .monogram {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .header-link {
        color: var(--muted);
        font-size: 0.9rem;
        text-decoration: none;
      }

      .header-link:hover,
      .header-link:focus-visible {
        color: var(--accent-dark);
      }

      main {
        display: grid;
        grid-template-columns: minmax(280px, 0.85fr) minmax(0, 1.15fr);
        gap: clamp(48px, 8vw, 112px);
        align-items: center;
        min-height: calc(100vh - 160px);
        padding: 64px 0;
      }

      .portrait-wrap {
        position: relative;
        isolation: isolate;
      }

      .portrait-wrap::before {
        position: absolute;
        inset: -14px 14px 14px -14px;
        z-index: -1;
        background: var(--accent);
        content: "";
      }

      .portrait {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--text);
        background: var(--surface);
        object-fit: cover;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 20px;
        color: var(--accent-dark);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 36px;
        height: 2px;
        background: var(--accent-dark);
        content: "";
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.2rem, 7vw, 6.7rem);
        font-weight: 500;
        line-height: 0.92;
        letter-spacing: 0;
      }

      .intro {
        max-width: 620px;
        margin: 30px 0 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 2vw, 1.28rem);
      }

      .details {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
        margin: 44px 0 0;
        padding: 30px 0 0;
        border-top: 1px solid var(--line);
      }

      .detail-label {
        display: block;
        margin-bottom: 6px;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .detail-value {
        margin: 0;
        font-size: 1rem;
        font-weight: 650;
      }

      .email-link {
        text-decoration-color: var(--accent);
        text-decoration-thickness: 3px;
        text-underline-offset: 5px;
      }

      .email-link:hover,
      .email-link:focus-visible {
        color: var(--accent-dark);
      }

      footer {
        display: flex;
        justify-content: space-between;
        padding: 24px 0 32px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.78rem;
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 32px, 560px);
        }

        .site-header {
          min-height: 72px;
        }

        main {
          grid-template-columns: 1fr;
          gap: 52px;
          min-height: auto;
          padding: 48px 0 72px;
        }

        .portrait-wrap {
          width: min(84vw, 420px);
        }

        h1 {
          font-size: clamp(3rem, 16vw, 5rem);
        }

        .details {
          grid-template-columns: 1fr;
          gap: 22px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <span class="monogram" aria-label="GuanTing Wu">GW.</span>
        <a class="header-link" href="mailto:wuguanting@zju.edu.cn">Contact</a>
      </header>

      <main>
        <div class="portrait-wrap">
          <img
            class="portrait"
            src="assets/img.jpg"
            alt="GuanTing Wu &#30340;&#22836;&#20687;"
            width="861"
            height="861"
          />
        </div>

        <section aria-labelledby="name">
          <p class="eyebrow">Profile</p>
          <h1 id="name">GuanTing<br />Wu</h1>
          <p class="intro">
            Master's student at Zhejiang University, focusing on AI agents and
            large language model reasoning.
          </p>

          <div class="details">
            <div>
              <span class="detail-label">Research</span>
              <p class="detail-value">Agent / LLM Reasoning</p>
            </div>
            <div>
              <span class="detail-label">Email</span>
              <p class="detail-value">
                <a class="email-link" href="mailto:wuguanting@zju.edu.cn">
                  wuguanting@zju.edu.cn
                </a>
              </p>
            </div>
          </div>
        </section>
      </main>

      <footer>
        <span>GuanTing Wu</span>
        <span>2026</span>
      </footer>
    </div>
  </body>
</html>
